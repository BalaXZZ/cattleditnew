<!doctype html><html lang="en"><meta charset="utf-8"><title>Muzzle annotation</title>
<style>body{font:16px system-ui;margin:24px;background:#f3f5f8;color:#182438}main{max-width:1000px;margin:auto}button{padding:12px;margin:4px;border:0;border-radius:6px;background:#164d87;color:white;cursor:pointer}canvas{display:block;max-width:100%;background:#ddd;touch-action:none}#message{min-height:24px;color:#a32929}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}input{width:80px;padding:8px}</style>
<main><h1>Review muzzle crops</h1><p>Draw a box around the textured muzzle, including both nostrils and a small margin. Exclude excess forehead and background. Reject if the muzzle cannot be reliably captured. Saves stay on this computer.</p><div class="bar"><button id="prev">Previous</button><button id="next">Next</button><label>Image <input id="jump" type="number" min="1"></label><span id="progress"></span></div><h3 id="label"></h3><canvas id="canvas"></canvas><div><button id="save">Save box and next</button><button id="reject">Reject and next</button><button id="clear">Clear drawn box</button><button id="pending">Next unreviewed</button></div><p id="message"></p></main>
<script>
let rows=[], index=0, box=null, start=null, picture=new Image(), ready=false;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),msg=document.querySelector('#message');
function paint(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(picture,0,0,canvas.width,canvas.height);if(box){const sx=canvas.width/picture.naturalWidth,sy=canvas.height/picture.naturalHeight;ctx.strokeStyle='#00ff80';ctx.lineWidth=3;ctx.strokeRect(box[0]*sx,box[1]*sy,(box[2]-box[0])*sx,(box[3]-box[1])*sy);}}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(picture.naturalWidth,Math.round((e.clientX-r.left)/r.width*picture.naturalWidth))),Math.max(0,Math.min(picture.naturalHeight,Math.round((e.clientY-r.top)/r.height*picture.naturalHeight)))];}
function progress(){document.querySelector('#progress').textContent=`${rows.filter(r=>r.muzzle_usable!=='pending').length} / ${rows.length} reviewed`;}
async function load(i){index=Math.max(0,Math.min(rows.length-1,i));ready=false;box=null;start=null;msg.textContent='Loading…';document.querySelector('#jump').value=index+1;const r=rows[index];document.querySelector('#label').textContent=`${r.animal_id} — ${r.image_path} — ${r.muzzle_usable}`;picture=new Image();picture.onload=()=>{canvas.width=Math.min(800,picture.naturalWidth);canvas.height=Math.round(canvas.width*picture.naturalHeight/picture.naturalWidth);box=r.muzzle_usable==='yes'?[r.x_min,r.y_min,r.x_max,r.y_max].map(Number):null;ready=true;paint();msg.textContent='';};picture.onerror=()=>msg.textContent='Image could not load';picture.src=`/api/image?index=${index}`;progress();}
canvas.onpointerdown=e=>{if(!ready)return;start=point(e);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!start)return;const p=point(e);box=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];paint();};canvas.onpointerup=()=>start=null;canvas.onpointercancel=()=>start=null;
async function save(status){if(!ready)return;if(status==='yes'&&!box){msg.textContent='Draw a muzzle box first.';return;}ready=false;try{const response=await fetch('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index,status,box})});const result=await response.json();if(!response.ok)throw Error(result.error);rows=await (await fetch('/api/images')).json();await load(index<rows.length-1?index+1:index);}catch(e){msg.textContent=e.message;ready=true;}}
document.querySelector('#save').onclick=()=>save('yes');document.querySelector('#reject').onclick=()=>save('no');document.querySelector('#prev').onclick=()=>load(index-1);document.querySelector('#next').onclick=()=>load(index+1);document.querySelector('#clear').onclick=()=>{if(ready){box=null;paint();}};document.querySelector('#jump').onchange=e=>load(Number(e.target.value)-1);document.querySelector('#pending').onclick=()=>{const i=rows.findIndex(r=>r.muzzle_usable==='pending');if(i>=0)load(i);else msg.textContent='All images reviewed.';};
(async()=>{rows=await(await fetch('/api/images')).json();document.querySelector('#jump').max=rows.length;const i=rows.findIndex(r=>r.muzzle_usable==='pending');if(rows.length)load(Math.max(0,i));})();
</script></html>
